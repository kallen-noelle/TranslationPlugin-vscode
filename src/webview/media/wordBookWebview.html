<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{MEDIA}} data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<style>
  :root {
    --bg: var(--vscode-sideBar-background, #252526);
    --fg: var(--vscode-sideBar-foreground, #cccccc);
    --border: var(--vscode-widget-border, #454545);
    --row-hover: var(--vscode-list-hoverBackground, #2a2d2e);
    --row-active: var(--vscode-list-activeSelectionBackground, #094771);
    --muted: var(--vscode-descriptionForeground, #9d9d9d);
    --input-bg: var(--vscode-input-background, #3c3c3c);
    --input-fg: var(--vscode-input-foreground, #cccccc);
    --input-border: var(--vscode-input-border, transparent);
    --button-bg: var(--vscode-button-background, #0e639c);
    --button-fg: var(--vscode-button-foreground, #ffffff);
    --link: var(--vscode-textLink-foreground, #3794ff);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--vscode-font-family, sans-serif);
    font-size: 13px; color: var(--fg); background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---------- Icon system (inline SVG, theme-adaptive) ---------- */
  .ic { width: 15px; height: 15px; flex: 0 0 auto; display: block; }
  .ic.use-fill { fill: currentColor; stroke: none; }
  .ic.use-stroke { fill: none; stroke: currentColor; }

  /* ---------- Top toolbar (like the original: sort on left, actions on right) ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 2px;
    padding: 3px 6px; border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .toolbar .spacer { flex: 1; }
  .toolbar button {
    background: transparent; border: none; border-radius: 4px;
    padding: 3px 6px; cursor: pointer; color: var(--fg); line-height: 0;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .toolbar button:hover { background: var(--row-hover); }
  .toolbar button.active { background: var(--row-active); }
  .toolbar button .sort-label { font-size: 11px; color: var(--muted); line-height: 1; }

  /* ---------- Word-book table view (column layout; settings toggle relies on it) ---------- */
  #view-table { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }

  /* ---------- Column header ---------- */
  .thead {
    display: grid; grid-template-columns: 1fr 1fr;
    padding: 4px 10px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted);
    border-bottom: 1px solid var(--border); flex: 0 0 auto; user-select: none;
  }
  .thead span.word { cursor: pointer; }

  /* ---------- Table body ---------- */
  #list { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; }
  .row {
    display: grid; grid-template-columns: 1fr 1fr;
    padding: 7px 10px; border-bottom: 1px solid var(--vscode-tree-indentGuidesStroke, rgba(128,128,128,0.2));
    cursor: pointer; align-items: start;
  }
  .row:hover { background: var(--row-hover); }
  .row.selected { background: var(--row-active); color: var(--vscode-list-activeSelectionForeground, #fff); }
  .row .word { font-size: 14px; font-weight: 600; word-break: break-word; padding-right: 8px; }
  .row .explanation {
    font-size: 12px; color: var(--muted); word-break: break-word;
    white-space: pre-wrap; line-height: 1.4; border-left: 1px solid var(--border); padding-left: 8px;
  }
  .row.selected .explanation { color: var(--vscode-list-activeSelectionForeground, #fff); opacity: 0.9; }

  /* ---------- Empty state ---------- */
  #empty {
    flex: 1 1 auto; display: none; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; text-align: center; padding: 24px; line-height: 1.6;
  }
  #empty a { color: var(--link); cursor: pointer; }

  /* ---------- Settings panel ---------- */
  #view-settings { display: none; flex: 1 1 auto; overflow-y: auto; padding: 12px 14px; }
  #view-settings h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin: 14px 0 6px;
  }
  #view-settings h3:first-child { margin-top: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 11px; color: var(--muted); }
  .field select, .field input {
    background: var(--input-bg); color: var(--input-fg);
    border: 1px solid var(--input-border); border-radius: 2px;
    padding: 5px 7px; font-size: 12px; font-family: inherit;
  }
  .field input[type="checkbox"] { width: auto; }
  .settings-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    background: var(--button-bg); color: var(--button-fg);
    border: none; padding: 6px 16px; border-radius: 2px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { opacity: 0.9; }
  .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--fg); }

  /* ---------- Provider dropdown (select with icons) ---------- */
  .psel { position: relative; }
  .psel-btn {
    width: 100%; display: flex; align-items: center; gap: 8px;
    background: var(--input-bg); color: var(--input-fg);
    border: 1px solid var(--input-border); border-radius: 2px;
    padding: 5px 7px; font-size: 12px; font-family: inherit;
    cursor: pointer; text-align: left; line-height: 1;
  }
  .psel-btn:hover { border-color: var(--border); }
  .psel-btn .psel-label { flex: 1; line-height: 1.2; }
  .psel-btn .psel-chev { opacity: 0.7; }
  .psel-menu {
    display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 200;
    background: var(--vscode-menu-background, #252526);
    color: var(--vscode-menu-foreground, #cccccc);
    border: 1px solid var(--vscode-menu-border, #454545); border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); padding: 3px 0; margin-top: 2px;
  }
  .psel.open .psel-menu { display: block; }
  .psel-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; cursor: pointer; font-size: 12px;
  }
  .psel-item:hover { background: var(--vscode-menu-selectionBackground, #094771); color: var(--vscode-menu-selectionForeground, #fff); }
  .psel-item.selected { font-weight: 600; }

  /* ---------- Context menu ---------- */
  #ctxmenu {
    position: fixed; z-index: 1000; min-width: 140px;
    background: var(--vscode-menu-background, #252526);
    color: var(--vscode-menu-foreground, #cccccc);
    border: 1px solid var(--vscode-menu-border, #454545); border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); padding: 4px 0; display: none;
  }
  #ctxmenu .item {
    padding: 5px 14px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  #ctxmenu .item:hover { background: var(--vscode-menu-selectionBackground, #094771); color: var(--vscode-menu-selectionForeground, #fff); }
  #ctxmenu .item .ic { width: 13px; height: 13px; }
  #ctxmenu .sep { height: 1px; background: var(--vscode-menu-separatorBackground, #454545); margin: 4px 6px; }
</style>
</head>

    </button>
    <button id="wordOfDay" title="每日一词">
      <svg class="ic use-fill"><use href="#i-lightbulb"></use></svg>
    </button>
    <button id="refresh" title="刷新">
      <svg class="ic use-stroke"><use href="#i-refresh"></use></svg>
    </button>
    <button id="settings" title="设置">
      <svg class="ic use-fill"><use href="#i-gear"></use></svg>
    </button>

  </div>

        <button type="button" class="psel-btn">
          <svg class="ic psel-ic"><use href="#i-engine-google"></use></svg>

        <div class="psel-menu">

        </div>
      </div>

      <div class="psel" id="s-ttsEngine" data-value="edge">
        <button type="button" class="psel-btn">
          <svg class="ic psel-ic use-fill"><use href="#i-speech"></use></svg>
          <span class="psel-label">Microsoft Edge TTS</span>
          <svg class="ic psel-chev use-stroke"><use href="#i-sort"></use></svg>
        </button>
        <div class="psel-menu">
          <div class="psel-item selected" data-value="edge"><svg class="ic use-fill"><use href="#i-speech"></use></svg><span>Microsoft Edge TTS</span></div>
          <div class="psel-item" data-value="openai"><svg class="ic"><use href="#i-engine-openai"></use></svg><span>OpenAI TTS</span></div>
        </div>
      </div>
    </div>
    <div class="field"><label>Edge 音色</label><input id="s-edgeVoice" placeholder="如 zh-CN-XiaoxiaoNeural,留空自动"></div>
    <div class="field"><label>OpenAI 音色</label>
      <select id="s-openAiVoice"><option value="alloy">alloy</option><option value="echo">echo</option><option value="fable">fable</option><option value="onyx">onyx</option><option value="nova">nova</option><option value="shimmer">shimmer</option></select></div>

    <h3>OpenAI 兼容</h3>
    <div class="field"><label>Base URL</label><input id="s-baseUrl" placeholder="https://api.openai.com"></div>
    <div class="field"><label>模型</label><input id="s-model" placeholder="gpt-4o-mini"></div>
    <div class="field"><label>API Key</label><input id="s-apiKey" type="password" placeholder="留空表示使用已保存的 Key"></div>

    <div class="settings-actions">
      <button class="btn" id="saveSettingsBtn">保存</button>
      <button class="btn secondary" id="backBtn">返回</button>
    </div>
  </div>

  <div id="ctxmenu"></div>

<script>
  (function () {
    const vscode = acquireVsCodeApi();
    const $ = (id) => document.getElementById(id);
    let entries = [];
    let selectedId = null;
    let menuVisible = false;
    let sortMode = 'time'; // 'time' | 'asc' | 'desc'

    // ---- Toolbar buttons ----
    $('refresh').addEventListener('click', () => vscode.postMessage({ type: 'refresh' }));
    $('wordOfDay').addEventListener('click', () => vscode.postMessage({ type: 'command', command: 'translation.wordOfDay' }));
    $('openDialogLink').addEventListener('click', () => vscode.postMessage({ type: 'command', command: 'translation.showDialog' }));

    $('sortBtn').addEventListener('click', () => {
      sortMode = sortMode === 'time' ? 'asc' : sortMode === 'asc' ? 'desc' : 'time';
      render();
    });
    $('colWord').addEventListener('click', () => {
      sortMode = sortMode === 'asc' ? 'desc' : 'asc';
      render();
    });

    // ---- Settings toggle ----
    // NOTE: #view-table is `display:flex; flex-direction:column` in CSS.
    // Restoring with '' falls back to that rule; setting 'flex' here without
    // a direction would lay the header/rows out side by side.
    function showSettings(show) {
      $('view-settings').style.display = show ? 'block' : 'none';
      $('view-table').style.display = show ? 'none' : '';
      $('settings').classList.toggle('active', show);
    }
    $('settings').addEventListener('click', () => {
      const visible = $('view-settings').style.display !== 'none';
      if (visible) { showSettings(false); }
      else { vscode.postMessage({ type: 'getSettings' }); showSettings(true); }
    });
    $('backBtn').addEventListener('click', () => showSettings(false));
    $('saveSettingsBtn').addEventListener('click', () => {
      vscode.postMessage({ type: 'saveSettings', settings: collectSettings() });
    });

    function collectSettings() {
      return {
        defaultEngine: getPsel('s-defaultEngine'),
        sourceLanguage: $('s-sourceLanguage').value,
        targetLanguage: $('s-targetLanguage').value,
        replaceSeparator: $('s-replaceSeparator').value,
        'hover.enabled': $('s-hover').checked,
        ttsEngine: getPsel('s-ttsEngine'),
        'tts.edge.voice': $('s-edgeVoice').value,
        'tts.openai.voice': $('s-openAiVoice').value,
        'openai.baseUrl': $('s-baseUrl').value,
        'openai.model': $('s-model').value,
        'openai.apiKey': $('s-apiKey').value,
      };
    }

    // ---- Provider dropdown (icon select) ----
    function initPsel(id) {
      const el = $(id);
      const btn = el.querySelector('.psel-btn');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.psel.open').forEach((o) => { if (o !== el) o.classList.remove('open'); });
        el.classList.toggle('open');
      });
      el.querySelectorAll('.psel-item').forEach((item) => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          setPsel(id, item.dataset.value);
          el.classList.remove('open');
        });
      });
      document.addEventListener('click', (e) => { if (!el.contains(e.target)) el.classList.remove('open'); });
    }
    function setPsel(id, value) {
      const el = $(id);
      const item = el.querySelector('.psel-item[data-value="' + value + '"]');
      if (!item) return;
      el.dataset.value = value;
      el.querySelector('.psel-label').textContent = item.querySelector('span').textContent;
      const itemUse = item.querySelector('use').getAttribute('href');
      const btnUse = el.querySelector('.psel-ic use');
      btnUse.setAttribute('href', itemUse);
      // keep the fill-mode class of the chosen item's icon
      const btnIcon = el.querySelector('.psel-ic');
      const itemIcon = item.querySelector('.ic');
      btnIcon.className = itemIcon.className.replace(/\bic\b/, 'ic psel-ic');
      el.querySelectorAll('.psel-item').forEach((i) => i.classList.toggle('selected', i === item));
    }
    function getPsel(id) { return $(id).dataset.value || ''; }
    initPsel('s-defaultEngine');
    initPsel('s-ttsEngine');

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function iconSvg(id, cls) {
      return '<svg class="ic ' + cls + '"><use href="#' + id + '"></use></svg>';
    }

    function sorted() {
      const list = [...entries];
      if (sortMode === 'asc') list.sort((a, b) => a.original.localeCompare(b.original));
      else if (sortMode === 'desc') list.sort((a, b) => b.original.localeCompare(a.original));
      else list.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
      return list;
    }

    function render() {
      const label = sortMode === 'asc' ? 'A-Z' : sortMode === 'desc' ? 'Z-A' : '时间';
      $('sortLabel').textContent = label;
      $('sortBtn').title = '排序(当前: ' + label + ')';

      const list = $('list');
      const empty = $('empty');
      if (!entries || entries.length === 0) {
        list.style.display = 'none'; empty.style.display = 'flex'; return;
      }
      list.style.display = 'block'; empty.style.display = 'none';
      list.innerHTML = '';
      for (const e of sorted()) {
        const row = document.createElement('div');
        row.className = 'row' + (e.id === selectedId ? ' selected' : '');
        row.dataset.id = e.id;
        row.innerHTML =
          '<div class="word">' + esc(e.original) + '</div>' +
          '<div class="explanation">' + esc(e.translation || '') + '</div>';
        row.addEventListener('click', () => {
          selectedId = e.id; render();
          vscode.postMessage({ type: 'detail', entry: e });
        });
        row.addEventListener('contextmenu', (ev) => {
          ev.preventDefault(); selectedId = e.id; render();
          showMenu(ev.clientX, ev.clientY, e);
        });
        list.appendChild(row);
      }
    }

    // ---- Context menu ----
    function showMenu(x, y, entry) {
      const menu = $('ctxmenu');
      menu.innerHTML = '';
      const addItem = (iconId, iconCls, label, action) => {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = iconId ? iconSvg(iconId, iconCls) : '';
        item.appendChild(document.createTextNode(label));
        item.addEventListener('click', () => { hideMenu(); action(); });
        menu.appendChild(item);
      };
      addItem('i-star', 'use-fill', '详情', () => vscode.postMessage({ type: 'detail', entry }));
      addItem('i-copy', 'use-fill', '复制', () => vscode.postMessage({ type: 'copy', entry }));
      addItem('i-speech', 'use-fill', '朗读', () => vscode.postMessage({ type: 'speak', entry }));
      const sep = document.createElement('div'); sep.className = 'sep'; menu.appendChild(sep);
      addItem('i-star-off', 'use-stroke', '删除', () => vscode.postMessage({ type: 'delete', entry }));
      menu.style.display = 'block';
      const rect = menu.getBoundingClientRect();
      menu.style.left = Math.min(x, window.innerWidth - rect.width - 4) + 'px';
      menu.style.top = Math.min(y, window.innerHeight - rect.height - 4) + 'px';
      menuVisible = true;
    }
    function hideMenu() { $('ctxmenu').style.display = 'none'; menuVisible = false; }
    document.addEventListener('click', (e) => { if (menuVisible && !e.target.closest('#ctxmenu')) hideMenu(); });
    window.addEventListener('blur', hideMenu);

    // ---- Messages from extension ----
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg.type === 'entries') {
        entries = msg.entries || [];
        render();
      } else if (msg.type === 'settings') {
        fillSettings(msg.settings || {}, msg.apiKey || '');
      } else if (msg.type === 'saved') {
        showSettings(false);
        vscode.postMessage({ type: 'getWords' });
      }
    });

    // ---- Settings fill ----
    function fillSettings(s, apiKey) {
      setPsel('s-defaultEngine', s.defaultEngine || 'google');
      $('s-sourceLanguage').value = s.sourceLanguage || 'auto';
      $('s-targetLanguage').value = s.targetLanguage || 'zh-CN';
      $('s-replaceSeparator').value = s.replaceSeparator || 'original';
      $('s-hover').checked = !!s['hover.enabled'];
      setPsel('s-ttsEngine', s.ttsEngine || 'edge');
      $('s-edgeVoice').value = s['tts.edge.voice'] || '';
      $('s-openAiVoice').value = s['tts.openai.voice'] || 'alloy';
      $('s-baseUrl').value = s['openai.baseUrl'] || 'https://api.openai.com';
      $('s-model').value = s['openai.model'] || 'gpt-4o-mini';
      $('s-apiKey').value = '';
      $('s-apiKey').placeholder = apiKey ? '已保存(****),输入以更新' : '未配置';
    }

    // Populate language selects.
    function fillLanguages() {
      const langOpts = (skipAuto) => {
        const codes = ['auto','zh-CN','zh-TW','en','ja','ko','fr','de','es','pt','pt-BR','ru','it','nl','pl','tr','vi','th','id','ar','hi','he','sv','da','no','fi','cs','hu','ro','bg','uk','el','sk','hr','sl','lt','lv','et','fa','ur','bn','ta','te','ca','fil','sw','cy'];
        return codes.filter((c) => !skipAuto || c !== 'auto')
          .map((c) => '<option value="' + c + '">' + c + '</option>').join('');
      };
      $('s-sourceLanguage').innerHTML = langOpts(false);
      $('s-targetLanguage').innerHTML = langOpts(true);
    }
    fillLanguages();

    // Ask for the initial word list.
    vscode.postMessage({ type: 'getWords' });
  })();
</script>
</body>
</html>
